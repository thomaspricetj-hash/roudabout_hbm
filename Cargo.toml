[package]
name = "hbm_roundabout"
version = "0.1.0"
edition = "2021"
authors = ["Thomas"]
license = "Proprietary"
description = "Multilayer Roundabout-Based HBM Routing Architecture with parallel heatmaps, multilayer indices, and adaptive scratchpad reinforcement."

[dependencies]
# Parallel scoring + heatmap updates
rayon = "1.10"

# Async compatibility for future async controller modes
tokio = { version = "1.37", features = ["full"] }

# High-performance timing + instrumentation
instant = "0.1"

# Optional: structured logging for debugging routing behavior
log = "0.4"
env_logger = "0.11"

# Optional: smallvec for fast per-layer vectors
smallvec = "1.13"

# Optional: serde for future serialization of metrics or traces
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
